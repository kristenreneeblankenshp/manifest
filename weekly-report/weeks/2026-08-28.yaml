data_freshness: >-
  Market levels use the latest published official observations available as of
  the Aug. 31 publication run. Where Friday official series were not yet
  posted, the report identifies the latest official observation rather than
  fabricating a Friday value. Publication-morning geopolitical/oil moves are
  treated as an event overlay, not as week-ending data.
