client_brief: >-
  The Manifest portfolio remains fully allocated under its rules-governed
  model, with a neutral/risk-control posture. Credit spreads tightened and
  NVIDIA delivered strong earnings, but the Federal Reserve reinforced its
  inflation-fighting stance at Jackson Hole and renewed U.S.-Iran conflict
  lifted oil again into publication morning. Preserve the {positions}-position
  Merrill executable model, selectively fund healthcare and quality industrials
  only when below approved bands, maintain NVIDIA at target after its evidence
  gate, and hold AVGO/PANW at or below target into this week's events.

