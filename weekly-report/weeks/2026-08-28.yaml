# Manifest MWIR weekly inputs. Start each week with:
#   python -m mwir new-week weeks/<last week>.yaml --holdings <new csv>
# then edit the narrative, scores and guidance below.
#
# Text fields may use {placeholders} that are filled from the computed model
# so numbers in the prose never drift from the tables:
#   {total} {positions} {composite} {week_ending} {publication_date}
#   {sleeve:<key>} e.g. {sleeve:strategic}

week_ending: 2026-08-28
publication_date: 2026-08-31
status: official            # official | draft
holdings_csv: ../holdings/2026-08-28.csv

headline: CONSTRUCTIVE PARTICIPATION - HAWKISH FED / GEOPOLITICAL DISCIPLINE
subhead: >-
  Remain fully model-allocated, but do not expand aggregate risk. Strong
  earnings and tighter credit spreads are offset by a more hawkish Fed path and
  renewed Iran/oil escalation into publication morning.

gauge:
  composite: 62
  prior_composite: 63
  delta: -1
  gamma: -1
  delta_gamma_note: policy-event cooling

compass:                    # [label, value, note]
  - [FED RANGE, "3.50-3.75%", unchanged]
  - [HY OAS, "2.63%", calm / improving]
  - [10Y UST, "4.67%*", still restrictive]
  - [VIX, "14.43", contained]

executive_summary:          # [bold lead, text]
  - - Portfolio posture
    - >-
      retain the {total} rules-governed Merrill executable model. The week
      improved on earnings, credit and volatility, but Friday's hawkish Jackson
      Hole message and renewed U.S.-Iran strikes into Aug. 31 argue against a
      net risk increase.
  - - Implementation
    - >-
      enforce MRGES-001. Berkshire Hathaway remains analytical only at 0.00%
      executable. Release the prior NVIDIA event hold after the Aug. 26
      evidence review, but keep semiconductor/networking exposure at
      disciplined targets; place AVGO and PANW behind this week's earnings
      gates.
  - - Incremental capital
    - >-
      favor healthcare and quality industrials only when below approved bands.
      Maintain energy exposure without chasing the publication-morning oil
      spike.
  - - Control boundary
    - >-
      actual account weights remain unavailable. This report publishes model
      guidance and monitoring bands; it does not infer drift or authorize live
      trades.

footnote: >-
  *Latest official FRED daily observation available for DGS10 was 4.67% on
  Aug 27; Friday market yield moved higher after Jackson Hole.

# ---- Page 2: signal dashboard -------------------------------------------
components:                 # 0-10, order is display order
  Growth: 5
  Inflation: 4
  Fed / Liquidity: 4
  Credit: 9
  Earnings: 9
  Breadth: 6
  Momentum: 6
  Volatility: 7
  Rates: 4
  Geopolitics / Oil: 2

risk_tape:
  - [S&P 500, "+0.49%"]
  - [Nasdaq Composite, "+0.85%"]
  - [Dow Industrials, "+0.53%"]
  - [VIX close, "14.43"]
  - [WTI crude, "$83.40 Fri / ~$86.31 Mon"]
  - [Brent crude, "$89.31 Fri / ~$90.97 Mon"]

signal_interpretation:
  - "Credit improved again: HY OAS fell to 2.63% on the latest official observation."
  - "Financial stress remains below zero: STLFSI4 -0.8107 (latest published week)."
  - NVIDIA Q2 results materially strengthened the earnings evidence set.
  - Friday Jackson Hole guidance raised the probability of a September hike.
  - Monday oil/geopolitical escalation offsets part of the week-ending improvement.
  - Composite slips to 62 from 63; Gamma remains negative.

decision_rule: >-
  The signal mix supports full model participation with a defensive risk
  budget: preserve quality anchors, healthcare, industrial infrastructure and
  income ballast; allow NVIDIA to revert from event hold to maintain-at-target
  after strong results; constrain AVGO/PANW additions through their evidence
  gates; do not chase energy after the renewed geopolitical premium.
official_posture: 100% MODEL ALLOCATION - SELECTIVE INTERNAL ROTATION ONLY

# ---- Page 3: macro -----------------------------------------------------
macro:                      # [heading, text]
  - - RATES & LIQUIDITY
    - >-
      Fed target remains 3.50-3.75%. The latest official 10-year Treasury
      observation was 4.67% on Aug. 27, down modestly from Aug. 21, but Chair
      Kevin Warsh's Jackson Hole remarks reinforced a hawkish reaction and
      increased September hike expectations.
  - - INFLATION
    - >-
      The 10-year breakeven averaged 2.32% for the week ending Aug. 28.
      Inflation remains the key policy constraint; renewed oil strength into
      Aug. 31 raises the risk of headline re-acceleration.
  - - CREDIT & STRESS
    - >-
      High-yield OAS tightened to 2.63% on Aug. 27. STLFSI4 was -0.8107 for the
      week ending Aug. 21, still below zero and consistent with below-average
      system stress. Credit is not validating broad de-risking.
  - - EARNINGS
    - >-
      NVIDIA reported Q2 FY2027 revenue of $96.2B, +106% y/y, with Data Center
      revenue of $89.0B, +117% y/y. The result clears the prior Aug. 26 event
      gate, though concentration discipline remains in force.
  - - GEOPOLITICS / OIL
    - >-
      WTI finished Aug. 28 at $83.40 and Brent at $89.31, both down on the
      week. Renewed U.S.-Iran strikes over the weekend pushed Monday
      indications to about $86.31 WTI and $90.97 Brent, restoring an
      inflationary event premium.

event_gates_title: FORWARD EVENT GATES - WEEK OF AUG 31
event_gates:                # [date, event, action]
  - [SEP 1, Palo Alto Networks, Maintain event hold; review cybersecurity evidence after release.]
  - [SEP 3, Broadcom, Hold AVGO at or below target into earnings; reassess AI/networking concentration.]
  - [SEP 4, U.S. payrolls, "Re-score growth, rates and Fed/liquidity after employment data."]

# ---- Page 4: allocation ------------------------------------------------
deployment_hierarchy:
  - Selective adds - VHT, SYK, JNJ, LLY, DHR, DE, CAT, ETN, GE and PH - only when below band and after account controls.
  - Maintain core anchors, NVIDIA at disciplined target after evidence review, financial infrastructure, income ballast and existing energy exposure.
  - Constrain AVGO and PANW at or below target through this week's event gates; do not chase energy on the renewed geopolitical premium.

# Analytical-only names: part of the MFPDF baseline, 0.00% executable. Their
# baseline weight is redistributed pro rata inside `sleeve` (MRGES-001).
excluded:
  BRK.B:
    name: Berkshire Hathaway
    sleeve: strategic
    mfpdf: 3.02
    reason: Merrill coverage is unavailable

