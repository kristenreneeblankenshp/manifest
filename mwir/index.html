<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MWIR Report Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="mwir.css">
<script src="zacks.js"></script>
<script src="mwir.js"></script>
</head>
<body>
<div class="app">
  <aside id="panel" class="ctl">
    <div class="brand">
      <div class="brand-row">
        <span class="kick">MANIFEST INSTITUTIONAL INVESTMENT SYSTEM</span>
        <span class="beta">BETA · ZACKS-INTEGRATED</span>
      </div>
      <h1>MWIR Report Builder</h1>
      <p>Load the week's holdings, update signals and narrative, then save the report as PDF.</p>
    </div>

    <div class="zk">
      <div class="row-between"><strong id="zk-asof"></strong><span id="zk-matched" class="mono"></span></div>
      <div id="zk-counts"></div>
      <div class="muted">Rank, market cap and earnings dates come from <code>zacks.js</code>. Replace that file each week to refresh. The screen is report page 7.</div>
    </div>

    <div class="setup">
      <div class="grid2">
        <label class="fld">Week ending<input id="week-ending" type="date"></label>
        <label class="fld">Publication date<input id="pub-date" type="date"></label>
      </div>
      <label class="fld">Holdings file (Date, Symbol, Weights CSV)<input id="csv" type="file" accept=".csv,text/csv"></label>
      <div id="import-msg" class="import-msg" hidden></div>
      <div class="actions">
        <button type="button" class="primary" data-action="print">Save as PDF / Print</button>
        <button type="button" data-action="reset">Reset to 28 Aug example</button>
      </div>
    </div>

    <nav id="tabs" class="tabs" aria-label="Input sections"></nav>
    <div id="tab-body" class="tab-body"></div>
  </aside>

  <main id="report" class="stage"></main>
</div>
</body>
</html>
