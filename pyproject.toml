[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manifest-workbench"
version = "0.4.0"
description = "Console application for the Manifest Workbench: CISC-001 / MOPS-003 RCC-004 MASR Registry & Candidate Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
manifest-workbench = "manifest_workbench.cli:main"

[tool.setuptools]
packages = ["manifest_workbench"]

[tool.setuptools.package-data]
manifest_workbench = ["data/seed.json"]
