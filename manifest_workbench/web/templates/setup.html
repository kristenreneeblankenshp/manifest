<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up · Manifest Workbench</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body>
<div class="login">
  <div class="card">
    <b style="color:var(--navy);font-size:18px">Welcome to Manifest Workbench</b>
    <p class="muted small">Create the administrator account. This page is available only until the first account exists.</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}
    <form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label>Your name</label><input name="name" required style="width:100%;margin-bottom:10px">
      <label>Username</label><input name="username" required style="width:100%;margin-bottom:10px">
      <label>Password (10+ characters)</label><input name="password" type="password" minlength="10" required style="width:100%;margin-bottom:10px">
      <label>Confirm password</label><input name="confirm" type="password" minlength="10" required style="width:100%;margin-bottom:16px">
      <button class="gold" style="width:100%;justify-content:center">Create administrator</button>
    </form>
  </div>
</div>
</body></html>
